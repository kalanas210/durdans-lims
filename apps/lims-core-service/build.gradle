plugins {
	id 'java'
	// 'apply false' tells Gradle: "Don't run this here, just make it available for sub-modules"
	id 'org.springframework.boot' version '4.1.1' apply false
	id 'io.spring.dependency-management' version '1.1.7'
}

// Security patch levels newer than the Spring Boot 3.5.14 BOM. Keep the
// application on the compatible Spring 6 / Jakarta EE generation while
// overriding components with published HIGH/CRITICAL vulnerability fixes.
ext {
	set('spring-framework.version', '6.2.19')
	set('spring-data-bom.version', '2025.0.12')
	set('spring-kafka.version', '3.3.16')
	set('tomcat.version', '10.1.55')
	set('postgresql.version', '42.7.12')
	set('kafka.version', '3.9.2')
	set('netty.version', '4.1.136.Final')
	set('micrometer.version', '1.15.12')
	set('jackson-bom.version', '2.21.4')
}

allprojects {
	group = 'com.uom.lims'
	version = '0.0.1-SNAPSHOT'

	repositories {
		mavenCentral()
	}
}

subprojects {
	apply plugin: 'java'
	apply plugin: 'io.spring.dependency-management'
	apply plugin: 'jacoco'

	java {
		toolchain {
			languageVersion = JavaLanguageVersion.of(21)
		}
	}

	// Shared configurations and dependencies for ALL modules
	configurations {
		compileOnly {
			extendsFrom annotationProcessor
		}
	}

	dependencies {
		compileOnly 'org.projectlombok:lombok'
		annotationProcessor 'org.projectlombok:lombok'
		testImplementation 'org.springframework.boot:spring-boot-starter-test'
		testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	}

	dependencyManagement {
		dependencies {
			dependency 'org.lz4:lz4-java:1.8.1'
		}
	}

	tasks.withType(Test).configureEach {
		useJUnitPlatform()
		finalizedBy tasks.named('jacocoTestReport')
	}

	// Coverage report (XML for CI tooling, HTML for humans) — the demonstrable
	// "we measured our test coverage" evidence for the review.
	tasks.named('jacocoTestReport') {
		dependsOn tasks.named('test')
		reports {
			xml.required = true
			html.required = true
		}
	}
}
