name: Core Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/lims-core-service/**"
      - ".github/workflows/core-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/lims-core-service/**"
      - ".github/workflows/core-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

# CodeQL init fails when another analysis already holds the same commit, which is
# what happened when duplicate pushes started two identical runs. One at a time.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: apps/lims-core-service

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/lims-core-service/**/*.gradle', 'apps/lims-core-service/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build & test
        run: ./gradlew clean build --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-service-test-results
          path: "apps/lims-core-service/**/build/reports/tests/**"

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      # build-mode: none analyses the source directly instead of tracing a build.
      #
      # The traced build kept failing here: CodeQL wraps the compiler to observe
      # it, but `gradlew --no-daemon` still forks a separate compiler process the
      # tracer does not follow, so the run ended in "No source code was seen
      # during the build" after ~5 minutes. Moving the module under apps/ made it
      # worse, because `uses:` steps ignore defaults.run.working-directory and so
      # init and analyze look at the workspace root while the build ran a level
      # down. Buildless analysis removes both problems and is quicker.
      - name: Init CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: java
          build-mode: none
      - name: Analyze
        uses: github/codeql-action/analyze@v4
