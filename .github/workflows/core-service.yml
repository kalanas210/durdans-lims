name: Core Service CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/lims-core-service/**"
      - ".github/workflows/core-service.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/lims-core-service/**"
      - ".github/workflows/core-service.yml"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

defaults:
  run:
    working-directory: apps/lims-core-service

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('apps/lims-core-service/**/*.gradle', 'apps/lims-core-service/gradle/wrapper/gradle-wrapper.properties') }}

      - name: Build & test
        run: ./gradlew clean build --no-daemon

      - name: Publish test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-service-test-results
          path: "apps/lims-core-service/**/build/reports/tests/**"

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
      - name: Init CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: java
      - name: Build
        run: ./gradlew :lims-core-service-app:compileJava --no-daemon
      - name: Analyze
        uses: github/codeql-action/analyze@v3
