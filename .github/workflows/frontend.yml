name: Frontend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  security-events: write

# One run per ref at a time. Two pushes landing on main seconds apart used to
# start two identical runs, which then raced each other: both uploaded a SARIF
# for the same commit (one lost) and both ran `deploy-service.sh frontend`
# against the same host (one lost). Queue instead — and on a PR, where only the
# newest commit matters, cancel the superseded run rather than queue it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AWS_INSTANCE_ID: ${{ vars.AWS_INSTANCE_ID }}
  ECR_REPO: durdans-lims/frontend

defaults:
  run:
    working-directory: apps/frontend

jobs:
  verify:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Enable pnpm
        run: corepack enable
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm exec tsc --noEmit
      - name: Unit tests
        run: pnpm test --if-present
      - name: Build (sanity)
        run: pnpm build

  image:
    name: Image build, scan, deploy
    needs: verify
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Build context is the app directory, not the repo root — keeps the image
      # small and stops an unrelated app's changes invalidating the layer cache.
      - name: Build image
        run: |
          docker build \
            --build-arg NEXT_PUBLIC_API_URL="${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:11000' }}" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_URL="${{ vars.NEXT_PUBLIC_KEYCLOAK_URL || 'http://localhost:8081' }}" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_REALM="${{ vars.NEXT_PUBLIC_KEYCLOAK_REALM || 'lims-realm' }}" \
            --build-arg NEXT_PUBLIC_KEYCLOAK_CLIENT_ID="${{ vars.NEXT_PUBLIC_KEYCLOAK_CLIENT_ID || 'lims-frontend' }}" \
            -t lims-frontend:${{ github.sha }} .

      - name: Trivy gate (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lims-frontend:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

      # Keep the full vulnerability inventory in GitHub code scanning without
      # making MEDIUM/LOW findings override the HIGH/CRITICAL release gate.
      - name: Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: lims-frontend:${{ github.sha }}
          format: sarif
          output: trivy-frontend.sarif
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          exit-code: "0"
          ignore-unfixed: true

      # trivy-action is a `uses:` step, so it ignores defaults.run.working-directory
      # and writes to the workspace root. Both paths below must stay root-relative.
      #
      # continue-on-error because this step only files a report: the HIGH/CRITICAL
      # release gate already ran and passed above. It was blocking, and when the
      # code-scanning API rejected a concurrent upload the job failed here — taking
      # the ECR push and the SSM deploy (both `if:`-gated on the job) down with it,
      # so a green build silently never reached the host. A reporting step must not
      # be able to do that. `category` keeps this SARIF in its own code-scanning
      # lane so it never overwrites another workflow's results for the same commit.
      - name: Upload Trivy SARIF
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-frontend.sarif
          category: trivy-frontend

      - name: Configure AWS credentials (OIDC)
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to ECR
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        id: ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag + push to ECR
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        run: |
          REG=${{ steps.ecr.outputs.registry }}
          docker tag lims-frontend:${{ github.sha }} $REG/$ECR_REPO:${{ github.sha }}
          docker tag lims-frontend:${{ github.sha }} $REG/$ECR_REPO:latest
          docker push $REG/$ECR_REPO:${{ github.sha }}
          docker push $REG/$ECR_REPO:latest

      - name: Deploy to host (SSM)
        if: ${{ github.ref == 'refs/heads/main' && vars.AWS_DEPLOY_ROLE_ARN != '' && vars.AWS_INSTANCE_ID != '' }}
        run: |
          PARAMS=$(jq -nc --arg command "/opt/lims/deploy-service.sh frontend $GITHUB_SHA" '{commands:[$command]}')
          COMMAND_ID=$(aws ssm send-command \
            --region "$AWS_REGION" \
            --document-name "AWS-RunShellScript" \
            --instance-ids "$AWS_INSTANCE_ID" \
            --comment "deploy frontend ${{ github.sha }}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)

          if ! aws ssm wait command-executed \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_INSTANCE_ID"; then
            aws ssm get-command-invocation \
              --region "$AWS_REGION" \
              --command-id "$COMMAND_ID" \
              --instance-id "$AWS_INSTANCE_ID" \
              --query '{Status:Status,Output:StandardOutputContent,Error:StandardErrorContent}' || true
            exit 1
          fi

          aws ssm get-command-invocation \
            --region "$AWS_REGION" \
            --command-id "$COMMAND_ID" \
            --instance-id "$AWS_INSTANCE_ID" \
            --query 'StandardOutputContent' \
            --output text
