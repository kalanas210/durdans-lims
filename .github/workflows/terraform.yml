name: Terraform

on:
  push:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "infra/terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: infra/terraform

jobs:
  validate:
    name: fmt, init, validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.5"
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  security-scan:
    name: Checkov (IaC misconfig scan)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Checkov
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/terraform
          framework: terraform
          quiet: true
          soft_fail: true # report findings without blocking the demo; tighten for prod
          output_format: cli
